x-airflow-common:
  &airflow-common
  image: apache/airflow:3.3.1
  environment:
    AIRFLOW__SMTP__SMTP_HOST: smtp.gmail.com
    AIRFLOW__SMTP__SMTP_PORT: 587
    AIRFLOW__SMTP__SMTP_STARTTLS: "true"
    AIRFLOW__SMTP__SMTP_SSL: "false"
    AIRFLOW__SMTP__SMTP_USER: youremail@gmail.com
    AIRFLOW__SMTP__SMTP_PASSWORD: ***************
    AIRFLOW__SMTP__SMTP_MAIL_FROM: youremail@gmail.com
    AIRFLOW_CONN_SMTP_DEFAULT: "smtp://youremail%40gmail.com:youremail@smtp.gmail.com:587?disable_ssl=true"
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__EXECUTE_TASKS_NEW_PYTHON_INTERPRETER: "true"
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"
    AIRFLOW__API_AUTH__JWT_SECRET: "********"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "****:****"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: "/opt/airflow/config/simple_auth_manager_passwords.json"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./config:/opt/airflow/config
    - ./data:/opt/airflow/data
    - ./sql:/opt/airflow/sql
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:

  postgres:
    image: postgres:16
    container_name: WeatherLakeDataPlatform_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - weatherlake_data_platform_postgres:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    container_name: WeatherLakeDataPlatform_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
  

  airflow-scheduler:
    <<: *airflow-common
    container_name: WeatherLakeDataPlatform_scheduler
    command: scheduler

  airflow-dag-processor:
    <<: *airflow-common
    container_name: WeatherLakeDataPlatform_dag_processor
    command: dag-processor

  airflow-api-server:
    <<: *airflow-common
    container_name: WeatherLakeDataPlatform_api_server
    command: api-server
    ports:
      - "8080:8080"

volumes:
  weatherlake_data_platform_postgres:
